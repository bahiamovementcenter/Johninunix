[project]
name = "typst-widget"
version = "0.1.0"
description = "Typst documents in marimo and Jupyter, compiled in the browser with typst.ts"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.9"
dependencies = ["anywidget>=0.9", "traitlets"]

[project.optional-dependencies]
dev = ["marimo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typst_widget"]
