name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - name: Formatting
        run: nix develop --command nixfmt --check flake.nix jd.nix organist/flake.nix
      - name: Flake check
        run: nix flake check
      - name: Organist shell
        working-directory: organist
        # path:, not the default git+file: on the runner, Organist's import from
        # derivation fails with the latter ("regenerate-files.drv is not valid")
        run: nix develop path:. --command jd version
