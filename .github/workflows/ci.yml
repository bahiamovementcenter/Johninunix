name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - name: Formatting
        run: nix develop --command nixfmt --check flake.nix jd.nix organist/flake.nix
      - name: Flake check
        run: nix flake check
      - name: Organist shell
        working-directory: organist
        # Determinate Nix's lazy trees break Organist's import from derivation
        # ("regenerate-files.drv is not valid"); the templates repo does the same
        env:
          NIX_CONFIG: lazy-trees = false
        run: nix develop --command jd version
